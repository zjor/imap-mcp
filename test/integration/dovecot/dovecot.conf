# Dovecot 2.3 config for imap-mcp integration tests. Not for production.
protocols = imap
listen = *

# Unlimited process memory. The default limit breaks the amd64 image under
# emulation on arm64 hosts (rosetta cannot map its heap).
default_vsz_limit = 0

log_path = /dev/stdout
info_log_path = /dev/stdout

# Any username logs in with password "testpass". Each user gets its own maildir.
auth_mechanisms = plain login
passdb {
  driver = static
  args = password=testpass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
first_valid_uid = 1000
last_valid_uid = 1000

mail_location = maildir:~/Maildir
mail_plugins =

# TLS only: 993 implicit TLS, 143 STARTTLS; no login without TLS.
ssl = required
ssl_cert = </etc/dovecot/certs/server.pem
ssl_key = </etc/dovecot/certs/server.key
disable_plaintext_auth = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox "Odeslaná pošta" {
    auto = subscribe
  }
}

protocol imap {
  mail_max_userip_connections = 10
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
